<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Architecture: an ESP32-S3 device talks over WebSocket to a Python voice server on one laptop; the server calls a language model, the console configures it, and MySQL and Redis store state.">
  <style>
    .bg { fill: #f7f3ea; }
    .box { fill: #fffdf8; stroke: #d8cfbe; stroke-width: 1.2; }
    .box-accent { fill: #fffdf8; stroke: #cf5430; stroke-width: 1.6; }
    .group { fill: #f2efe6; stroke: #d9d0bf; stroke-width: 1.2; }
    .device { fill: #fdf1e9; stroke: #e2b8a7; stroke-width: 1.4; }
    .label { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #8a8170; }
    .h { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; fill: #1d1b16; }
    .t { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 13px; fill: #1d1b16; }
    .small { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11.5px; fill: #6f6757; }
    .mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11px; fill: #6f6757; }
    .arrow { stroke: #cf5430; stroke-width: 1.6; fill: none; }
    .arrow-dash { stroke: #2f46c8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
  </style>

  <defs>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cf5430"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f46c8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="480"/>

  <!-- device -->
  <rect class="device" x="28" y="150" width="222" height="190" rx="16"/>
  <text class="label" x="44" y="178">ESP32-S3 DEVICE</text>
  <rect class="box" x="44" y="196" width="76" height="34" rx="8"/>
  <text class="t" x="82" y="218" text-anchor="middle">Mic</text>
  <rect class="box" x="136" y="196" width="94" height="34" rx="8"/>
  <text class="t" x="183" y="218" text-anchor="middle">Audio codec</text>
  <rect class="box" x="44" y="252" width="186" height="36" rx="8"/>
  <text class="t" x="137" y="275" text-anchor="middle">WebSocket client</text>
  <rect class="box" x="44" y="304" width="186" height="26" rx="8"/>
  <text class="t" x="137" y="322" text-anchor="middle">OLED + speaker</text>

  <path class="arrow" d="M120 213 H136" marker-end="url(#arrow-coral)"/>
  <path class="arrow" d="M183 230 V252" marker-end="url(#arrow-coral)"/>
  <path class="arrow" d="M137 288 V304" marker-end="url(#arrow-coral)"/>

  <!-- laptop -->
  <rect class="group" x="300" y="64" width="660" height="380" rx="18"/>
  <text class="label" x="320" y="92">LOCAL SERVER — ONE LAPTOP</text>

  <!-- voice server -->
  <rect class="box-accent" x="326" y="140" width="200" height="190" rx="12"/>
  <text class="h" x="342" y="168">Python voice server</text>
  <text class="t" x="342" y="196">SenseVoice ASR</text>
  <text class="t" x="342" y="218">→ LLM</text>
  <text class="t" x="342" y="240">→ TTS</text>
  <text class="small" x="342" y="272">Zhipu · Qwen · DeepSeek</text>
  <text class="small" x="342" y="290">or a local Ollama model</text>
  <text class="mono" x="342" y="314">:8000  WebSocket + OTA</text>

  <!-- console -->
  <rect class="box" x="570" y="118" width="150" height="62" rx="10"/>
  <text class="h" x="585" y="145">manager-web</text>
  <text class="small" x="585" y="164">Vue console</text>

  <!-- api -->
  <rect class="box" x="570" y="220" width="150" height="70" rx="10"/>
  <text class="h" x="585" y="247">manager-api</text>
  <text class="small" x="585" y="266">Java 21</text>

  <!-- mysql -->
  <g>
    <path d="M765 140 v48 a55 12 0 0 0 110 0 v-48" fill="#e9edff" stroke="#aeb9f0" stroke-width="1.2"/>
    <ellipse cx="820" cy="140" rx="55" ry="12" fill="#f2f4ff" stroke="#aeb9f0" stroke-width="1.2"/>
    <text class="t" x="820" y="174" text-anchor="middle">MySQL 8</text>
  </g>

  <!-- redis -->
  <g>
    <path d="M765 260 v48 a55 12 0 0 0 110 0 v-48" fill="#e9edff" stroke="#aeb9f0" stroke-width="1.2"/>
    <ellipse cx="820" cy="260" rx="55" ry="12" fill="#f2f4ff" stroke="#aeb9f0" stroke-width="1.2"/>
    <text class="t" x="820" y="294" text-anchor="middle">Redis 7</text>
  </g>

  <!-- device <-> voice server -->
  <path class="arrow" d="M250 270 H288 V235 H326" marker-start="url(#arrow-coral)" marker-end="url(#arrow-coral)"/>
  <text class="mono" x="286" y="205" text-anchor="middle">WebSocket</text>

  <!-- voice -> config -->
  <path class="arrow-dash" d="M526 250 H570" marker-end="url(#arrow-blue)"/>
  <text class="mono" x="548" y="233" text-anchor="middle">config</text>

  <!-- console -> api -->
  <path class="arrow" d="M645 180 V220" marker-end="url(#arrow-coral)"/>

  <!-- api -> mysql -->
  <path class="arrow" d="M720 242 H742 V152 H765" marker-end="url(#arrow-coral)"/>

  <!-- api -> redis -->
  <path class="arrow" d="M720 268 H765" marker-end="url(#arrow-coral)"/>

  <!-- caption -->
  <text class="small" x="320" y="420">The device never calls a model directly. It holds one WebSocket; the laptop owns the pipeline and the configuration.</text>
</svg>
